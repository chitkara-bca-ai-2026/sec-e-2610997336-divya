<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readers' Haven – Book Registration & Order Form</title>
</head>
<body>

    <h1>Readers' Haven – Book Registration & Order Form</h1>

    <!-- Task 1: Form using <form> tag with action and target attributes[span_2](start_span)[span_2](end_span) -->
    <form action="order_handler.php" method="POST" target="_blank">

        <!-- Task 9: Hidden input field with the specified value[span_3](start_span)[span_3](end_span) -->
        <input type="hidden" name="form_source" value="Readers Haven Book Order">

        <!-- Task 2 & 3: Customer Name with placeholder[span_4](start_span)[span_4](end_span) -->
        <div>
            <label for="custname">Customer Name:</label><br>
            <input type="text" id="custname" name="customer_name" placeholder="Enter your full name" required>
        </div>
        <br>

        <!-- Task 2 & 3: Email Address with placeholder[span_5](start_span)[span_5](end_span) -->
        <div>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>
        <br>

        <!-- Task 2 & 3: Mobile Number with placeholder[span_6](start_span)[span_6](end_span) -->
        <div>
            <label for="mobile">Mobile Number:</label><br>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>
        </div>
        <br>

        <!-- Task 2: Age[span_7](start_span)[span_7](end_span) -->
        <div>
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="1" max="120">
        </div>
        <br>

        <!-- Task 2: Password[span_8](start_span)[span_8](end_span) -->
        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required>
        </div>
        <br>

        <!-- Task 5: Favorite Book Category (Required Drop-down)[span_9](start_span)[span_9](end_span) -->
        <div>
            <label for="category">Favorite Book Category:</label><br>
            <select id="category" name="category" required>
                <option value="" disabled selected>-- Select Category --</option>
                <option value="Fiction">Fiction</option>
                <option value="Science">Science</option>
                <option value="History">History</option>
                <option value="Children's Books">Children's Books</option>
            </select>
        </div>
        <br>

        <!-- Task 6: Book Title and Quantity with minimum quantity[span_10](start_span)[span_10](end_span) -->
        <div>
            <label for="booktitle">Book Title:</label><br>
            <input type="text" id="booktitle" name="book_title" placeholder="Enter book title" required>
        </div>
        <br>

        <div>
            <label for="quantity">Quantity:</label><br>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>
        </div>
        <br>

        <!-- Task 4: Delivery Date and Preferred Delivery Time[span_11](start_span)[span_11](end_span) -->
        <div>
            <label for="deliverydate">Delivery Date:</label><br>
            <input type="date" id="deliverydate" name="delivery_date">
        </div>
        <br>

        <div>
            <label for="deliverytime">Preferred Delivery Time:</label><br>
            <input type="time" id="deliverytime" name="delivery_time">
        </div>
        <br>

        <!-- Task 7: Preferred Payment Method (Radio buttons)[span_12](start_span)[span_12](end_span) -->
        <div>
            <label>Preferred Payment Method:</label><br>
            <input type="radio" id="cod" name="payment_method" value="Cash on Delivery" required>
            <label for="cod">Cash on Delivery</label>
            
            <input type="radio" id="online" name="payment_method" value="Online Payment">
            <label for="online">Online Payment</label>
        </div>
        <br>

        <!-- Task 8: Additional Services (Checkboxes for multiple selections)[span_13](start_span)[span_13](end_span) -->
        <div>
            <label>Additional Services:</label><br>
            <input type="checkbox" id="gift" name="services[]" value="Gift Wrapping">
            <label for="gift">Gift Wrapping</label>
            
            <input type="checkbox" id="bookmark" name="services[]" value="Bookmark">
            <label for="bookmark">Bookmark</label>

            <input type="checkbox" id="express" name="services[]" value="Express Delivery">
            <label for="express">Express Delivery</label>
            
            <input type="checkbox" id="card" name="services[]" value="Greeting Card">
            <label for="card">Greeting Card</label>
        </div>
        <br>

        <!-- Task 3 & 11: Delivery Address and Special Instructions using Textarea with placeholder[span_14](start_span)[span_14](end_span)[span_15](start_span)[span_15](end_span)[span_16](start_span)[span_16](end_span) -->
        <div>
            <label for="address">Delivery Address:</label><br>
            <textarea id="address" name="delivery_address" rows="4" cols="40" placeholder="Enter your full delivery address..." required></textarea>
        </div>
        <br>

        <div>
            <label for="instructions">Special Instructions:</label><br>
            <textarea id="instructions" name="special_instructions" rows="3" cols="40" placeholder="Enter any special delivery instructions..."></textarea>
        </div>
        <br>

        <!-- Task 10: File upload field with accept attribute[span_17](start_span)[span_17](end_span) -->
        <div>
            <label for="referencefile">Upload Reference Image/Document:</label><br>
            <input type="file" id="referencefile" name="reference_file" accept="image/*,.pdf">
        </div>
        <br>

        <!-- Task 12: Submit and Reset controls using <button> element[span_18](start_span)[span_18](end_span) -->
        <div>
            <button type="submit">Submit Order</button>
            <button type="reset">Reset Form</button>
        </div>

    </form>

</body>
</html>
