<!DOCTYPE html>
<html>
<head>
    <title>Interactive Restaurant Menu</title>
</head>
<body>
<h1>Interactive Restaurant Menu</h1>
<img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600"
     usemap="#foodmap" width="600" height="400"
     alt="Pizza">
<map name="foodmap">
<area shape="circle" coords="100,100,50"
href="https://unsplash.com/s/photos/pizza"
alt="Pizza" target="_blank">
<area shape="circle" coords="300,100,50"
href="https://unsplash.com/s/photos/burger"
alt="Burger" target="_blank">
<area shape="rect" coords="50,200,200,300"
href="https://unsplash.com/s/photos/sandwich"
alt="Sandwich" target="_blank">
<area shape="rect" coords="250,200,400,300"
href="https://unsplash.com/s/photos/cake"
alt="Cake" target="_blank">
<area shape="poly" coords="450,50,500,100,480,150,430,120"
href="https://unsplash.com/s/photos/ice-cream"
alt="Ice Cream" target="_blank">
<area shape="poly" coords="450,200,520,250,450,300"
href="https://unsplash.com/s/photos/samosa"
alt="Samosa" target="_blank">
<area shape="default"
href="https://unsplash.com/s/photos/food"
alt="Full Menu" target="_blank">
</map>
</body>
</html>
