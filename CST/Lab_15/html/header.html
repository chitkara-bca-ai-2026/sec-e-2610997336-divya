<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Explore the World – Travel Agency</title>
</head>
<!-- Task 2 & 5: Three main horizontal sections using rows -->
<frameset rows="20%, 65%, 15%" frameborder="1" border="2">
    
    <!-- Task 1 & 8: Header Frame -->
    <frame src="header.html" name="headerFrame" scrolling="no" noresize marginwidth="10" marginheight="10">
    
    <!-- Task 3 & 5: Nested frameset dividing Main Content into three vertical columns -->
    <frameset cols="25%, 45%, 30%" frameborder="1" border="2">
        <frame src="nav.html" name="navFrame" scrolling="auto" marginwidth="10" marginheight="10">
        <frame src="destinations.html" name="destFrame" scrolling="auto" marginwidth="10" marginheight="10">
        <frame src="packages.html" name="pkgFrame" scrolling="auto" marginwidth="10" marginheight="10">
    </frameset>
    
    <!-- Task 8 & 10: Footer Frame -->
    <frame src="footer.html" name="footerFrame" scrolling="no" noresize marginwidth="10" marginheight="10">
    
</frameset>
</html>
