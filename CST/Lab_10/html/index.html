<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
</head>
<body>

    <table border="1" cellpadding="8" cellspacing="0" align="center">
        <caption><h2>Today's Special Menu</h2></caption>

            <tr align="center">
                <th>Category</th>
                <th>Food Item</th>
                <th>Price (&#8377;)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Starters Section -->
            <tr>
                <td rowspan="3" align="center"><b>Starters</b></td>
                <td>Spring Rolls</td>
                <td align="right">120</td>
            </tr>
            <tr>
                <td>Garlic Bread</td>
                <td align="right">100</td>
            </tr>
            <tr>
                <td>Veg Soup</td>
                <td align="right">80</td>
            </tr>

            <!-- Main Course Section -->
            <tr>
                <td rowspan="3" align="center"><b>Main Course</b></td>
                <td>Paneer Butter Masala</td>
                <td align="right">180</td>
            </tr>
            <tr>
                <td>Veg Biryani</td>
                <td align="right">150</td>
            </tr>
            <tr>
                <td>Dal Tadka</td>
                <td align="right">120</td>
            </tr>

            <!-- Desserts Section -->
            <tr>
                <td rowspan="3" align="center"><b>Desserts</b></td>
                <td>Chocolate Cake</td>
                <td align="right">90</td>
            </tr>
            <tr>
                <td>Ice Cream</td>
                <td align="right">70</td>
            </tr>
            <tr>
                <td>Gulab Jamun</td>
                <td align="right">60</td>
            </tr>

            <!-- Drinks Section -->
            <tr>
                <td rowspan="3" align="center"><b>Drinks</b></td>
                <td>Fresh Lime Soda</td>
                <td align="right">50</td>
            </tr>
            <tr>
                <td>Cold Coffee</td>
                <td align="right">80</td>
            </tr>
            <tr>
                <td>Mango Shake</td>
                <td align="right">70</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
